syntax = "proto3";

package com.github.sherman.server.grpc.testing;

option java_multiple_files = true;
option java_package = "com.github.sherman.server.grpc.testing";
option java_outer_classname = "GreeterProto";

service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}
